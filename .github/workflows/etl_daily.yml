name: Automated AI Model Release ETL & Popularity Prediction Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual execution from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Execute ETL & Popularity Predictor Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python main.py --run-etl --train-ml --limit 500

      - name: Commit & Push Updated Dataset
        run: |
          git config --global user.name "tharinm"
          git config --global user.email "tharindumadhushan864@gmail.com"
          git add data/processed/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes detected in model datasets."
          else
            git commit -m "chore(etl): daily automated AI model dataset update [skip ci]"
            git push origin HEAD:main
          fi
